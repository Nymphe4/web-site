<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Bitki Rehberi</title>
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fbeaff, #e0ffe0);
  color: #333;
  overflow-x: hidden;
  transition: margin-left .5s;
}

h1, h2 {
  font-family: 'Playfair Display', serif;
  color: #5c3d99;
}

/* 🌿 Sidebar */
.sidebar {
  height: 100%;
  width: 0; /* Başlangıçta gizli */
  position: fixed;
  z-index: 10;
  top: 0;
  left: 0;
  background: linear-gradient(135deg, #fbeaff, #e0ffe0);
  backdrop-filter: blur(8px);
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidebar .closebtn {
  position: absolute;
  top: 10px;
  right: 25px;
  font-size: 36px;
  color: #4b2c82;
  text-decoration: none;
}

.sidebar button {
  background: rgba(255,255,255,0.7);
  border: none;
  border-radius: 50%;
  width: 80px;
  height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  margin: 20px auto;
  position: relative;
  overflow: hidden;
}

.sidebar button img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
}

.sidebar ul {
  list-style-type: none;
  padding: 0;
}

.sidebar ul li {
  padding: 10px 20px;
}

.sidebar ul li:hover {
  background-color: #f5c5e6;
  transition: 0.7s;
}

.sidebar ul li a {
  text-decoration: none;
  font-family: 'Playfair Display', serif;
  color: #4b2c82;
  font-weight: bold;
  display: block;
}

/* Hamburger Açma Butonu */
.openbtn {
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.7);
  color: #4b2c82;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  position: fixed;
  z-index: 5;
  top: 20px;
  left: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.openbtn:hover {
  background: rgba(255, 255, 255, 1);
}

/* Dynamic Panel */
.dynamic-panel {
  display: none;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  padding: 20px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  margin: 10px auto;
  max-width: 1000px;
}

.plant-card {
  background: rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 10px;
  width: 180px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  
}

  /* ===== DETAIL PANEL (SCROLL ÇÖZÜMÜ) ===== */

.detail-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;            /* Ekran yüksekliği */
  background: white;
  z-index: 9999;

  display: none;            /* Başlangıçta kapalı */
  overflow-y: auto;         /* Scroll burada oluşacak */

  padding: 30px;
  box-sizing: border-box;
}

/* Panel aktif olunca aç */
.detail-panel.active {
  display: block;
}

/* Arka plan scroll'u kilitlemek için */
body.modal-open {
  overflow: hidden;
}


.plant-card:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.plant-card img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
}

/* Hero Bölümü */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, rgba(236,198,238,0.7), rgba(203,255,212,0.7)),
  url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1500&q=80') center/cover;
  text-align: center;
  color: #fff;
  position: relative;
  transition: margin-left .5s;
}

.hero h1 {
  font-size: 3rem;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
  margin-bottom: 20px;
}

.hero input {
  padding: 12px 20px;
  border: none;
  border-radius: 30px;
  outline: none;
  width: 60%;
  max-width: 400px;
  font-size: 1rem;
}
/* Arama Paneli -*/
#searchPanel {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 15px;
  overflow-x: auto;
  padding: 10px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  
  max-width: auto;
  background: linear-gradient(135deg, rgba(236,198,238,0.7), rgba(203,255,212,0.7));
  border-radius: 20px;
  z-index: 9999;
}

/* Kartlar */
#searchPanel .plant-card {
  min-width: 150px;
  flex: 0 0 auto;
  cursor: pointer;
  color: black;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 15px;
  padding: 10px;
  transition: transform 0.3s, box-shadow 0.3s;
}

#searchPanel .plant-card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

#dynamicPanel {
  margin: auto;
  top: 100%;           /* input'un hemen altı */
  overflow-x:auto;
  width: 100%;
background: linear-gradient(135deg, rgba(236,198,238,0.7), rgba(203,255,212,0.7));
  color:black;
  display: none;
  z-index: -1;
}
/* Sparkle */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  animation: sparkleAnim 3s infinite ease-in-out;
  opacity: 0.8;
}

@keyframes sparkleAnim {
  0% { transform: translateY(0) scale(1); opacity: 0.8; }
  50% { transform: translateY(-20px) scale(1.4); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 0.8; }
}

/* Kategoriler */
.categories {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin: 40px auto;
  padding: 20px;
  max-width: 1000px;
  transition: margin-left .5s;
}

.category {
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border-radius: 30px;
  padding: 30px;
  width: 180px;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-weight: bold;
  color: #4b2c82;
  box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: all 0.3s ease;
}

.category:hover {
  transform: scale(1.1);
  box-shadow: 0 12px 24px rgba(0,0,0,0.2);
  background: linear-gradient(145deg, #ffe6f7, #e6ffe6);
}

/* Detay Paneli */
.detail-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(15px);
  border-radius: 25px;
  padding: 30px;
  width: 300px;
  max-width: 90%;
  text-align: center;
  z-index: 100;
  transition: transform 0.3s ease-in-out;
}

.detail-panel.active {
  transform: translate(-50%, -50%) scale(1);
}

.detail-panel img {
  width: 80%;
  border-radius: 15px;
  margin-bottom: 15px;
}

.close-btn {
  margin-top: 15px;
  padding: 8px 20px;
  border: none;
  border-radius: 20px;
  background: #e6ffe6;
  cursor: pointer;
  font-weight: bold;
  color: #4b2c82;
}
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  top: var(--y);
  left: var(--x);
  opacity: 0.8;
  pointer-events: none;
}
.sparkle-magic {
  animation: magic 2.5s infinite ease-in-out;
}

@keyframes magic {
  0% {
    transform: translateY(10px) scale(0);
    opacity: 0;
  }
  50% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-25px) scale(1.3);
    opacity: 0;
  }
}



</style>
</head>

  <div class="category" data-target="Yapraklı Bitkiler">🌿 Yapraklı Bitkiler</div>
  <div class="category" data-target="Güneşi Sevenler">🌞 Güneşi Sevenler</div>

<!-- Dynamic Panel -->
<div class="dynamic-panel" id="dynamicPanel"></div>

<!-- Detail Panel -->
<div class="detail-panel" id="detailPanel">
  <img src="" alt="Bitki Resmi" id="detailImg">
  <h3 id="detailName"></h3>
  <p id="detailInfo"></p>
  <button class="close-btn" id="closeBtn">Kapat</button>
</div>

<script>
// Sidebar Fonksiyonları
function openNav() {
  document.querySelector('.sidebar').style.width = "280px";
}

function closeNav() {
  document.querySelector('.sidebar').style.width = "0";
}

// JSON'DAN VERİ ÇEKME
let plants = {};
let allPlants = [];

fetch("plants.json")
  .then(res => res.json())
  .then(data => {
    plants = data;
    allPlants = Object.values(plants).flat();
  });

// ELEMENTLER
const searchInput = document.getElementById("searchInput");
const searchPanel = document.getElementById("searchPanel");
const categoryPanel = document.getElementById("dynamicPanel");

const detailPanel = document.getElementById('detailPanel');
const detailImg = document.getElementById('detailImg');
const detailName = document.getElementById('detailName');
const detailInfo = document.getElementById('detailInfo');
const closeBtn = document.getElementById('closeBtn');


// ARAMA
searchInput.addEventListener("input", function () {
  const query = this.value.toLowerCase().trim();
  searchPanel.innerHTML = "";

  if (!query) {
    searchPanel.style.display = "none";
    return;
  }

  const filtered = allPlants.filter(plant =>
    plant.name.toLowerCase().includes(query) ||
    plant.info.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    searchPanel.innerHTML = "<p>😔 Sonuç bulunamadı</p>";
    searchPanel.style.display = "flex";
    return;
  }

  filtered.forEach(plant => {
    const card = document.createElement("div");
    card.className = "plant-card";
    card.innerHTML = `
      <img src="${plant.img}" alt="${plant.name}">
      <h3>${plant.name}</h3>
    `;

    card.addEventListener("click", () => openDetail(plant));
    searchPanel.appendChild(card);
  });

  searchPanel.style.display = "flex";
});

// DETAY PANELİ AÇ
function openDetail(plant) {
  detailImg.src = plant.img;
  detailName.textContent = plant.name;
  detailInfo.textContent = plant.info;
  detailPanel.classList.add('active');

  // Arama panelini kapat
  searchPanel.style.display = "none";
  document.body.classList.add('modal-open');
}

// DETAY PANELİ KAPAT
closeBtn.addEventListener('click', () => {
  detailPanel.classList.remove('active');
  document.body.classList.remove('modal-open');
});



// KATEGORİ BUTONLARI
const buttons = document.querySelectorAll('.category');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-target');
    categoryPanel.innerHTML = "";

    if (!plants[target]) return;

    plants[target].forEach(plant => {
      const card = document.createElement('div');
      card.classList.add('plant-card');
      card.innerHTML = `
        <img src="${plant.img}" alt="${plant.name}">
        <h3>${plant.name}</h3>
      `;

      card.addEventListener('click', () => {
        openDetail(plant);
      });

      categoryPanel.appendChild(card);
    });

    categoryPanel.style.display = 'flex';
    categoryPanel.scrollIntoView({ behavior: 'smooth' });
  });
});

</script>
